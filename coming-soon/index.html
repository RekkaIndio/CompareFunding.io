<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Funding - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff8000 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .email-form {
            display: flex;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .email-input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
        }

        .email-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .submit-btn {
            padding: 1rem 2rem;
            background: #fff;
            color: #ff8000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .social-link {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .social-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .email-form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/assets/cflogowhite.png" alt="Fund Connector Logo" class="logo" onerror="this.style.display='none'">

        <h1>Compare Funding</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: 1rem; opacity: 0.9;">Coming Soon!</h2>
        <p>We're building something amazing to connect businesses with the perfect funding opportunities. Get ready for
            a revolutionary platform that will transform how businesses find and secure funding.</p>

        <form class="email-form" action="https://formspree.io/f/xvgrzrlp" method="POST" onsubmit="handleSubmit(event)">
            <input type="email" name="email" class="email-input" placeholder="Enter your email for early access"
                required>
            <input type="hidden" name="_subject" value="New Early Access Signup - Compare Funding">
            <input type="hidden" name="message" value="New early access signup for Compare Funding">
            <button type="submit" class="submit-btn" id="submit-btn">Notify Me</button>
        </form>

        <p style="font-size: 1rem; opacity: 0.7; margin-bottom: 1rem;">Launching Soon • Be the first to know</p>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const email = form.querySelector('.email-input').value;
            const submitBtn = document.getElementById('submit-btn');

            // Update button to show loading state
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            // Submit to Formspree
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    // Success
                    submitBtn.textContent = '✓ Sent!';
                    submitBtn.style.background = '#4ade80';
                    form.reset();

                    // Show success message
                    setTimeout(() => {
                        alert('Thank you! We\'ve received your email and will notify you when Compare Funding launches.');
                        submitBtn.textContent = 'Notify Me';
                        submitBtn.style.background = '#fff';
                        submitBtn.disabled = false;
                    }, 1000);
                } else {
                    throw new Error('Form submission failed');
                }
            }).catch(error => {
                // Error handling
                submitBtn.textContent = 'Try Again';
                submitBtn.disabled = false;
                alert('There was an issue submitting your email. Please try the contact button below or email us directly at hello@comparefunding.io');
            });
        }
    </script>

    <style>
        .contact-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</body>

</html>
